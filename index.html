<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Low SNR demos</title>

<style>

body{
    font-family:tahoma;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

.container{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:15px;
}

.card{
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card h3{
    font-size:14px;
    margin-top:0;
    word-break:break-word;
}

audio{
    width:100%;
}

</style>

</head>

<body>

<h1>Low SNR demos</h1>

<div id="container" class="container"></div>

<script>

fetch("files.json")
.then(r=>r.json())
.then(files=>{

files.sort((a,b)=>a.localeCompare(b,'fa'));

const container=document.getElementById("container");

files.forEach(file=>{

const title=file.replace(".mp3","");

container.innerHTML+=`

<div class="card">

<h3>${title}</h3>

<audio controls preload="none">

<source src="audio/${file}" type="audio/mpeg">

</audio>

</div>

`;

});

});

</script>

</body>

</html>
