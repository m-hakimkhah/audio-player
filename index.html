<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>پخش آنلاین فایل‌های صوتی</title>

<style>

body{
font-family:tahoma;
background:#f3f3f3;
max-width:700px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:20px;
margin:20px 0;
border-radius:10px;
box-shadow:0 0 10px #ddd;
}

audio{
width:100%;
}

</style>

</head>

<body>

<h1>فایل‌های صوتی</h1>

<div class="card">

<h3>صوت اول</h3>

<audio controls>
<source src="audio/song1.mp3" type="audio/mpeg">
</audio>

</div>

<div class="card">

<h3>صوت دوم</h3>

<audio controls>
<source src="audio/song2.mp3" type="audio/mpeg">
</audio>

</div>

<div class="card">

<h3>سخنرانی</h3>

<audio controls>
<source src="audio/lecture.mp3" type="audio/mpeg">
</audio>

</div>

</body>
</html>
